baseURL = 'https://speaking.metacog.co.kr/'
locale = 'en-us'
title = 'Speaking Lab'
theme = 'PaperMod'
paginate = 10

[params]
  env = 'production'
  title = 'Speaking Lab'
  description = 'Turn any transcript into a listening & read-aloud workout'
  author = 'jeonck'
  defaultTheme = 'auto'
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = false
  tocopen = false

  [params.homeInfoParams]
    Title = 'Speaking Lab 🎤'
    Content = 'Paste a class or conversation transcript and get back idioms, vocabulary, corrections, a fill-in-the-blank quiz, and a mini diary — ready for read-aloud practice.'

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/jeonck/speaking'

[menu]
  [[menu.main]]
    identifier = 'input'
    name = 'Add Transcript ✏️'
    url = 'https://github.com/jeonck/speaking/edit/main/input/script.md'
    weight = 5
  [[menu.main]]
    identifier = 'posts'
    name = 'Posts'
    url = '/posts/'
    weight = 10
  [[menu.main]]
    identifier = 'tags'
    name = 'Tags'
    url = '/tags/'
    weight = 20
  [[menu.main]]
    identifier = 'search'
    name = 'Search'
    url = '/search/'
    weight = 30

[outputs]
  home = ['HTML', 'RSS', 'JSON']

# Quiz sections use raw HTML <details>/<summary> accordions in generated posts
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
