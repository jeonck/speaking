baseURL = 'https://speaking.metacog.co.kr/'
locale = 'en-us'
title = 'Speaking Lab'
theme = 'PaperMod'
paginate = 10

[params]
  env = 'production'
  title = 'Speaking Lab'
  description = '유튜브 20~30초 구간으로 하는 직독직해·스피킹·듣기 연습'
  author = 'jeonck'
  defaultTheme = 'auto'
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = false
  tocopen = false
  mainSections = ['practice']
  # 실습 원본 채널 — 홈 첫 화면 아래 줄에 표시. 저작권 걱정 없는 미국 정부 공개 자료만 쓴다.
  sources = ['VOA Learning English', 'NASA', 'National Park Service', 'NOAA', 'American English']
  # 방문자에게 '구간 추가' 안내(홈 섹션·바닥글 링크)를 보일지. 메뉴 항목도 함께 되살린다.
  showAddSegment = false


  # 검색: 테마 기본값(threshold 0.4)은 긴 원고에서 아무 단어나 걸려서 더 엄격하게
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    ignoreLocation = true
    threshold = 0.2
    minMatchCharLength = 2
    keys = ['title', 'summary', 'content']

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/jeonck/speaking'

[menu]
  [[menu.main]]
    identifier = 'practice'
    name = '실습'
    url = '/practice/'
    weight = 10
  [[menu.main]]
    identifier = 'tags'
    name = '주제'
    url = '/tags/'
    weight = 20
  [[menu.main]]
    identifier = 'search'
    name = '검색'
    url = '/search/'
    weight = 30
  # '구간 추가'는 숨김 (params.showAddSegment와 함께 되살린다). 페이지가 아니라 동작이라
  # 되살리면 외부 링크 알약 버튼으로 보인다 (practice.css .menu a[href*="github.com"])
  # [[menu.main]]
  #   identifier = 'input'
  #   name = '구간 추가'
  #   url = 'https://github.com/jeonck/speaking/edit/main/input/script.md'
  #   weight = 40

[outputs]
  home = ['HTML', 'RSS', 'JSON']

# Quiz sections use raw HTML <details>/<summary> accordions in generated posts
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
