baseURL = 'https://speaking.metacog.co.kr/'
locale = 'en-us'
title = 'Speaking Lab'
theme = 'PaperMod'
paginate = 10

[params]
  env = 'production'
  title = 'Speaking Lab'
  description = 'Turn any transcript into a listening & read-aloud workout'
  author = 'jeonck'
  defaultTheme = 'auto'
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = false
  tocopen = false
  mainSections = ['practice']

  [params.homeInfoParams]
    Title = 'Speaking Lab 🎤'
    Content = 'Paste a YouTube segment and practice it the way it was meant to be learned: timed silent reading, timed read-aloud with stress guidance, script-hidden listening, and review.'

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/jeonck/speaking'

[menu]
  [[menu.main]]
    identifier = 'practice'
    name = '실습'
    url = '/practice/'
    weight = 10
  [[menu.main]]
    identifier = 'tags'
    name = '주제'
    url = '/tags/'
    weight = 20
  [[menu.main]]
    identifier = 'search'
    name = '검색'
    url = '/search/'
    weight = 30
  # 페이지가 아니라 동작이라 맨 끝에 버튼 모양으로 둔다 (practice.css .menu li:last-child)
  [[menu.main]]
    identifier = 'input'
    name = '구간 추가'
    url = 'https://github.com/jeonck/speaking/edit/main/input/script.md'
    weight = 40

[outputs]
  home = ['HTML', 'RSS', 'JSON']

# Quiz sections use raw HTML <details>/<summary> accordions in generated posts
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
